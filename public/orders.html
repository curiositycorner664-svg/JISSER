<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order History — JISSER</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="site-header-root"></div>

<main>
  <h2 style="margin-bottom:1.25rem;" data-i18n="orders_title">Order Manifest</h2>
  <div id="orders-container" data-i18n="loading">Loading...</div>
</main>

<footer class="site-footer">JISSER — Your Trusted Online Store.</footer>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script>
renderNav();
translatePage();

async function loadOrders() {
  const container = document.getElementById('orders-container');
  if (!getUser()) {
    container.innerHTML = `<p class="error-msg">${t('please_log_in_orders')}</p>`;
    return;
  }
  try {
    const orders = await apiFetch('/orders');
    if (orders.length === 0) {
      container.innerHTML = `<p>${t('no_orders_yet')}</p>`;
      return;
    }
    container.innerHTML = `
      <table>
        <thead><tr><th>${t('th_order')}</th><th>${t('th_date')}</th><th>${t('th_status')}</th><th>${t('th_terms')}</th><th>${t('th_total')}</th></tr></thead>
        <tbody>
          ${orders
            .map(
              (o) => `
            <tr>
              <td>#${o.id}</td>
              <td>${new Date(o.created_at).toLocaleDateString()}</td>
              <td><span class="badge ${o.status}">${t('status_' + o.status)}</span></td>
              <td>${t('terms_' + o.payment_terms)}</td>
              <td>$${Number(o.total).toFixed(2)}</td>
            </tr>`
            )
            .join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    container.innerHTML = `<p class="error-msg">${err.message}</p>`;
  }
}

loadOrders();
</script>
</body>
</html>
