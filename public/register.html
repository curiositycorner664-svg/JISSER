<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — JISSER</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="site-header-root"></div>

<main>
  <div class="ledger-card">
    <h2 data-i18n="register_title">Open a B2B Account</h2>
    <p style="font-size:0.85rem; color:var(--steel); margin-bottom:1.25rem;" data-i18n="register_subtitle">New accounts are reviewed before ordering — we'll set your credit terms on approval.</p>
    <form id="register-form">
      <label data-i18n="account_type_label">I want to</label>
      <div class="account-type-toggle" role="radiogroup" style="display:flex; gap:0.6rem; margin-bottom:1rem;">
        <label class="type-option" style="flex:1; display:flex; align-items:center; gap:0.4rem; border:1px solid var(--line); border-radius:var(--radius); padding:0.6rem 0.75rem; cursor:pointer; text-transform:none; font-weight:500; color:var(--stencil);">
          <input type="radio" name="accountType" value="buyer" checked style="width:auto; margin:0;" />
          <span data-i18n="account_type_buyer">Buy wholesale</span>
        </label>
        <label class="type-option" style="flex:1; display:flex; align-items:center; gap:0.4rem; border:1px solid var(--line); border-radius:var(--radius); padding:0.6rem 0.75rem; cursor:pointer; text-transform:none; font-weight:500; color:var(--stencil);">
          <input type="radio" name="accountType" value="seller" style="width:auto; margin:0;" />
          <span data-i18n="account_type_seller">Sell my products</span>
        </label>
      </div>
      <label id="companyNameLabel" data-i18n="company_name_label">Company Name</label>
      <input type="text" id="companyName" required />
      <label id="locationLabel" data-i18n="business_location_label" style="display:none;">Business Location</label>
      <input type="text" id="location" placeholder="City, State" style="display:none;" />
      <label data-i18n="contact_name_label">Contact Name</label>
      <input type="text" id="contactName" required />
      <label data-i18n="email_label">Email</label>
      <input type="email" id="email" required />
      <label data-i18n="password_hint_label">Password (min 8 characters)</label>
      <input type="password" id="password" minlength="8" required />
      <button type="submit" style="width:100%;" data-i18n="register_btn">Register</button>
      <p id="msg"></p>
    </form>
    <p><span data-i18n="already_have_account">Already have an account?</span> <a href="/login.html" data-i18n="log_in_link">Log in</a></p>
  </div>
</main>

<footer class="site-footer">JISSER — Your Trusted Online Store.</footer>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script>
renderNav();
translatePage();

const typeRadios = document.querySelectorAll('input[name="accountType"]');
function updateFormForType() {
  const isSeller = document.querySelector('input[name="accountType"]:checked').value === 'seller';
  document.getElementById('companyNameLabel').textContent = isSeller
    ? t('business_name_label') || 'Business Name'
    : t('company_name_label');
  document.getElementById('locationLabel').style.display = isSeller ? '' : 'none';
  document.getElementById('location').style.display = isSeller ? '' : 'none';
}
typeRadios.forEach((r) => r.addEventListener('change', updateFormForType));

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const accountType = document.querySelector('input[name="accountType"]:checked').value;
  try {
    const data = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        accountType,
        companyName: document.getElementById('companyName').value,
        contactName: document.getElementById('contactName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        location: document.getElementById('location').value,
      }),
    });
    msg.className = 'success-msg';
    msg.textContent = data.message;
    e.target.reset();
    updateFormForType();
  } catch (err) {
    msg.className = 'error-msg';
    msg.textContent = err.message;
  }
});
</script>
</body>
</html>
